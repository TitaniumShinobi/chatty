services:
  openvoice:
    image: ${OPENVOICE_IMAGE:-ghcr.io/myshell-ai/openvoice:latest}
    container_name: openvoice
    environment:
      OPENVOICE_API_KEY: ${OPENVOICE_API_KEY:-}
      OPENVOICE_PORT: ${OPENVOICE_PORT:-8001}
    ports:
      - "${OPENVOICE_PORT:-8001}:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
