<html lang="en">
  <head>
    <script>
(function () {
  var hour = new Date().getHours();
  var isNight = hour >= 19 || hour < 7;
  document.documentElement.setAttribute(
    'data-theme',
    isNight ? 'night' : 'light'
  );
})();
    </script>
