version: '3.8'

services:
  mocr-service:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MOCR_MAX_FRAMES=50
      - MOCR_FRAME_INTERVAL=2
      - MOCR_OCR_LANGUAGE=eng
      - MOCR_ASR_LANGUAGE=en
      - MOCR_MAX_FILE_SIZE=104857600
      - MOCR_PROCESSING_TIMEOUT=300000
      - MOCR_ENABLE_CACHING=true
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - mocr-service
    restart: unless-stopped

volumes:
  redis_data:
